name: CI

# Hosted Actions are off (billing) — the gate runs locally: AgentOS's swarm
# automerge sweep runs the same syntax + invariant checks via autonomy
# localChecks and posts the `agentos/ci` commit status. Re-enable by restoring
# the triggers and switching requiredStatuses back in AgentOS config/swarm.json.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Check static-site invariants
        run: node tools/check.js
